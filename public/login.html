<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Furk Cycle</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261103b">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <div class="login-brand">Sua Empresa</div>
      <h1>Furk Cycle</h1>
      <p>Sistema de Créditos Elegíveis</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">E-mail corporativo</label>
        <input type="email" id="email" name="email" placeholder="seu.nome@exemplo.com.br" required autofocus>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
      </div>

      <div class="form-error" id="loginError" style="display:none;"></div>

      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>

      <div class="login-extra">
        <span class="badge-sso">Acesso corporativo (SSO) disponível</span>
      </div>
    </form>
  </div>

  <script src="assets/js/api.js?v=20261103b"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('loginError');
    const btnLogin = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      if (!email || !senha) {
        errorDiv.textContent = 'Informe e-mail e senha.';
        errorDiv.style.display = 'block';
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';

      try {
        const data = await api.post('/api/auth/login.php', { email, senha });

        if (data.success && data.token) {
          api.setToken(data.token);
          localStorage.setItem('furki_cycle_usuario', JSON.stringify(data.usuario));
          window.location.href = 'creditos-elegiveis.html';
        } else {
          errorDiv.textContent = data.error || 'Falha no login.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = err.message || 'Erro de conexão. Tente novamente.';
        errorDiv.style.display = 'block';
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
