<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>403 - Acesso Proibido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 520px;
            text-align: center;
        }

        .code {
            font-size: 96px;
            font-weight: 700;
            color: #d2d2d7;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1d1d1f;
        }

        p {
            font-size: 16px;
            color: #6e6e73;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 14px;
            color: #86868b;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .code {
                font-size: 72px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">403</div>
        <h1>Acesso proibido</h1>
        <p>Você não tem permissão para acessar este recurso.</p>
        <p class="hint">Se você acredita que isso é um erro, entre em contato com o administrador.</p>
    </div>
</body>
</html>
